# File Path: config.yaml
# UNIVAC IX CORE FABRIC — GLOBAL PLATFORM ENVIRONMENT CONFIGURATION MASTER
# Priority Directives Enforced: Tier 1 Gov Compliance > Tier 2 Commercial Operations

# =========================================================================
# DOMAIN ZONE: TIER 01 — GOVERNMENT GEODETIC REGULATORY ANCHORAGE
# Monitored and Audited Natively by: DOI, OSHA, BLM_LAND_PEOPLE, and County
# =========================================================================
planetary_geodetic_anchor:
  origin_latitude: 47.6062          # Seattle, WA baseline base-station coordinate match
  origin_longitude: -122.3321
  local_coordinate_datum: "NAD83_WA_NORTH"
  safety_setback_buffer_mm: 50.8    # Strict 2-inch hardware perimeter cushion zone

# =========================================================================
# DOMAIN ZONE: CLIMATOLOGICAL FLUID DYNAMICS (BASIC AVIATION ENGINE)
# Processes microclimate vectors to identify structural surface hazards
# =========================================================================
microclimate_atmospheric_physics:
  base_elevation_altitude_ft: 45.0  # Station elevation parameters above sea level
  terrain_roughness_exponent: 0.14  # Open-field uniform surface roughness value
  ground_albedo_coefficient: 0.25   # Solar reflectivity rating for crop canopies
  enforced_gale_shutoff_kts: 45.0   # Maximum airspeed threshold before auto-E-Stop

# =========================================================================
# DOMAIN ZONE: CHRYSLER AEROSPACE VEHICLE KINEMATICS TRANSLATION
# Dynamically tunes electro-mechanical steering arrays over cross-server loops
# =========================================================================
aerospace_kinematics_bridge:
  # Intended baseline scaling multiplier (Value maps directly to VHDL generics)
  # Formula: 256 equals 1.0 nominal unity gain factor tracking
  chrysler_inertia_gain_default: 256
  
  # Dynamic operational gain ranges optimized for field implement weights
  mass_dependent_tuning_profiles:
    unladen_transit_profile: 128    # Scaled down to 0.5 to prevent light steering over-correction
    standard_excavation_load: 256   # 1.0 nominal feedback tracing matrix
    maximum_payload_saturation: 512 # Scaled up to 2.0 to counteract heavy momentum lag
    
  # Slip compensation filter updates based on track conditions
  chassis_slip_friction_modifier: 0.85 # Dry soil vs mud slide dampening constant

# =========================================================================
# DOMAIN ZONE: TIER 02 — COMMERCIAL AUTONOMIC INTERLOCK INTERFACES
# Manages multi-container communication ports and hardware thresholds
# =========================================================================
robotic_hardware_interlock_thresholds:
  maximum_allowable_torque_nm: 450.0 # Teletank actuator stress limit cutoff
  analog_window_tolerance_v: 0.002   # Strict native +/- 2mV logic tracking window
  industrial_clock_divider: 100     # Steps 1.0 GHz master clock down to 10.0 MHz execution
  target_network_bridge_port: 8080  # Central server-to-server JSON gateway port
