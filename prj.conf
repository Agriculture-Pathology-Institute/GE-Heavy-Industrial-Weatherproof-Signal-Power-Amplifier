# File Path: prj.conf (Inside the Amplifier Repository Root)
# Enable native networking features for cross-server JSON communication
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

# Hardware Core Performance Alignment
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
